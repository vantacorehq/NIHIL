<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".45"/></pattern></defs>
<rect width="1200" height="300" fill="#050507"/>
<line x1="40" y1="150" x2="1160" y2="150" stroke="#c1121f" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/></line>
<g transform="translate(40 45)" font-family="'Courier New',Consolas,monospace">
<rect width="250" height="210" fill="#0b0b0f" stroke="#2a2a33"/>
<rect width="250" height="4" fill="#c1121f"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="-0.0s" repeatCount="indefinite"/></rect>
<text x="18" y="52" font-size="30" fill="#c1121f" font-weight="900">01</text>
<text x="18" y="92" font-size="24" fill="#e8e6e3" font-weight="900" letter-spacing="3">FORBID</text>
<text x="18" y="120" font-size="13" fill="#8a8a92" letter-spacing="2">declare bans</text>
<text x="18" y="160" font-size="13" fill="#e8e6e3">var · forbid · require</text>
<text x="18" y="182" font-size="13" fill="#8a8a92">all_different · linear</text></g>
<g transform="translate(325 45)" font-family="'Courier New',Consolas,monospace">
<rect width="250" height="210" fill="#0b0b0f" stroke="#2a2a33"/>
<rect width="250" height="4" fill="#c1121f"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="-0.8s" repeatCount="indefinite"/></rect>
<text x="18" y="52" font-size="30" fill="#c1121f" font-weight="900">02</text>
<text x="18" y="92" font-size="24" fill="#e8e6e3" font-weight="900" letter-spacing="3">PROPAGATE</text>
<text x="18" y="120" font-size="13" fill="#8a8a92" letter-spacing="2">prune the space</text>
<text x="18" y="160" font-size="13" fill="#e8e6e3">GAC · bounds · pigeonhole</text>
<text x="18" y="182" font-size="13" fill="#8a8a92">before any search</text></g>
<g transform="translate(610 45)" font-family="'Courier New',Consolas,monospace">
<rect width="250" height="210" fill="#0b0b0f" stroke="#2a2a33"/>
<rect width="250" height="4" fill="#c1121f"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="-1.6s" repeatCount="indefinite"/></rect>
<text x="18" y="52" font-size="30" fill="#c1121f" font-weight="900">03</text>
<text x="18" y="92" font-size="24" fill="#e8e6e3" font-weight="900" letter-spacing="3">SEARCH</text>
<text x="18" y="120" font-size="13" fill="#8a8a92" letter-spacing="2">MRV · B&amp;B</text>
<text x="18" y="160" font-size="13" fill="#e8e6e3">forward checking</text>
<text x="18" y="182" font-size="13" fill="#8a8a92">LP-relaxation bounds</text></g>
<g transform="translate(895 45)" font-family="'Courier New',Consolas,monospace">
<rect width="250" height="210" fill="#0b0b0f" stroke="#2a2a33"/>
<rect width="250" height="4" fill="#c1121f"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="-2.4000000000000004s" repeatCount="indefinite"/></rect>
<text x="18" y="52" font-size="30" fill="#c1121f" font-weight="900">04</text>
<text x="18" y="92" font-size="24" fill="#e8e6e3" font-weight="900" letter-spacing="3">CARVE</text>
<text x="18" y="120" font-size="13" fill="#8a8a92" letter-spacing="2">survivors</text>
<text x="18" y="160" font-size="13" fill="#e8e6e3">first · count · best</text>
<text x="18" y="182" font-size="13" fill="#8a8a92">branch / merge / diff</text></g>
<rect x="-8" y="143" width="16" height="14" fill="#ff2a3d" filter="url(#glow)"><animate attributeName="x" from="40" to="1150" dur="4.5s" repeatCount="indefinite"/></rect>
<rect width="1200" height="300" fill="url(#scan)"/><rect x=".5" y=".5" width="1199" height="299" fill="none" stroke="#c1121f" stroke-opacity=".4"/></svg>