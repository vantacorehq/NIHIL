[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nihil-engine"
version = "0.2.0"
description = "Forbid the impossible, keep the answer: a zero-dependency constraint engine with GAC propagation, linear global constraints, branch-and-bound optimisation and branch/merge/diff of solution spaces."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["constraint-solver", "csp", "sudoku", "n-queens", "fixed-point", "closed-timelike-curves"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vantacorehq/nihil"
Issues = "https://github.com/vantacorehq/nihil/issues"

[tool.setuptools]
py-modules = ["nihil", "fixpoint"]
